<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitoramento de Sistemas — IOC</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17345d;font:16px Arial}header{background:#07366f;color:white;padding:24px clamp(16px,4vw,44px);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(23px,3vw,36px)}main{max-width:1300px;margin:auto;padding:22px clamp(12px,3vw,30px)}#msg,.banner,.card,.stat,.foot{background:white;border:1px solid #dce4ef;border-radius:12px;padding:17px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{margin:0;padding:20px}.card h2{font-size:22px;margin:0 0 12px}.pill{display:inline-block;padding:7px 13px;border-radius:30px;background:#087b32;color:white;font-weight:bold}.warn{border:2px solid #dfbd70;background:#fffdf6}.warn .pill{background:#a66b08}.bad{border:2px solid #e5a09a;background:#fff8f7}.bad .pill{background:#b42318}.detail{font-size:14px;line-height:1.5;margin-top:12px}.meta{font-size:13px;color:#53657c;margin-top:12px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{margin:0}.stat b{display:block;font-size:27px}.banner h2{margin:0 0 8px}.foot{margin-top:16px;line-height:1.5}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){header{display:block}.updated{margin-top:12px}.grid{grid-template-columns:1fr}.stats{gap:6px}.stat{font-size:12px;padding:10px}.stat b{font-size:22px}}
</style></head><body><header><div><h1>Painel Financeiro e Orçamentário IOC</h1></div></header><main><div id="msg" role="status">Carregando os dados dos seis sistemas monitorados…</div><div id="view" hidden></div></main><script>
(async function(){const $=id=>document.getElementById(id), names=[['siafi','SIAFI'],['contratos','Contratos.gov.br'],['compras','Compras.gov.br'],['sicaf','SICAF'],['govbr','gov.br'],['cadin','CADIN']],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch('./monitoramento-sistemas.json?cache='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' ao buscar o arquivo de dados');const data=await r.json();if(!Array.isArray(data.systems))throw Error('O arquivo não contém a lista de sistemas');const cards=names.map(([id,name])=>{const s=data.systems.find(x=>x.id===id);if(!s)return '<article class="card bad"><h2>'+name+'</h2><span class="pill">Sem dados</span><p>Coletor não retornou registro.</p></article>';const down=['FORA_DO_AR','INDISPONIVEL'].includes(s.status)||Number(s.http_status)>=500,warn=!down&&(s.condition?.status==='ATENCAO'||s.status==='INSTABILIDADE'||s.latency_status==='LENTA'),cls=down?'bad':warn?'warn':'',label=down?'Fora do ar':warn?'Atenção':'Acessível',reasons=[...(s.condition?.reasons||[])];if(s.latency_status==='LENTA')reasons.push('Resposta lenta: '+s.latency_ms+' ms');if(down)reasons.push(s.detail||'Indisponibilidade detectada');return '<article class="card '+cls+'"><h2>'+esc(name)+'</h2><span class="pill">'+label+'</span><div class="detail">'+(reasons.length?reasons.map(esc).join('<br>'):'Nenhum alerta externo identificado.')+'</div><div class="meta">HTTP '+esc(s.http_status??'—')+' · '+esc(s.latency_ms??'—')+' ms<br>Verificado: '+esc(s.checked_at||data.checked_at||'—')+'</div></article>'}).join(''),down=data.systems.filter(s=>['FORA_DO_AR','INDISPONIVEL'].includes(s.status)||Number(s.http_status)>=500).length,warn=data.systems.filter(s=>s.condition?.status==='ATENCAO'||s.status==='INSTABILIDADE'||s.latency_status==='LENTA').length;$('view').innerHTML='<section class="banner '+(down?'bad':warn?'warn':'')+'"><h2>'+ (down?down+' sistema(s) fora do ar':warn?warn+' sistema(s) com alerta':'Resumo do monitoramento')+'</h2><p>Seis sistemas previstos no monitoramento. Acesso HTTP público não comprova funcionamento autenticado ou transações internas.</p></section><section class="stats"><div class="stat"><b>'+Math.max(0,6-down-warn)+'</b>Sem alerta</div><div class="stat"><b>'+warn+'</b>Com atenção</div><div class="stat"><b>'+down+'</b>Fora do ar</div></section><section class="grid">'+cards+'</section>';$('msg').hidden=true;$('view').hidden=false}catch(e){$('msg').className='bad';$('msg').textContent='Falha ao carregar os dados: '+e.message+'. Os sistemas não serão marcados como operacionais.'}})();
</script></body></html>
