<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07366f">
<title>Monitoramento de Sistemas — IOC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17345d;font:16px Arial,sans-serif}
#monitor-fallback{max-width:900px;margin:9vh auto;padding:28px 22px;background:#fff;border:1px solid #d7e0ed;border-radius:16px;box-shadow:0 8px 28px #16345d12}
#monitor-fallback h1{font-size:clamp(22px,4vw,32px);margin:0 0 12px;color:#07366f}
#monitor-fallback p{line-height:1.5;margin:8px 0}
#monitor-fallback .hint{color:#53657c;font-size:14px}
#monitor-fallback .error{color:#a32323;font-weight:700}
</style>
</head>
<body>
<div id="monitor-fallback" role="status" aria-live="polite">
<h1>Monitoramento de Sistemas — IOC</h1>
<p id="monitor-message">Carregando os dados dos sistemas monitorados…</p>
<p class="hint">Se esta mensagem permanecer, atualize a página. O painel exibirá aqui qualquer falha no carregamento.</p>
</div>
<script>
(function(){
 var message=document.getElementById('monitor-message');
 var finished=false;
 function showError(text){
   if(finished)return;
   finished=true;
   message.className='error';
   message.textContent=text;
 }
 window.addEventListener('error',function(event){
   if(event.filename && event.filename.indexOf('monitoramento-sistemas.js')!==-1){
     showError('O módulo foi localizado, mas apresentou um erro ao executar. Detalhe: '+(event.message||'erro de JavaScript')+'.');
   }
 });
 window.addEventListener('unhandledrejection',function(event){
   showError('Falha inesperada ao iniciar o monitoramento: '+String(event.reason||'erro não identificado'));
 });
 var script=document.createElement('script');
 script.src='./monitoramento-sistemas.js?v=20261031-1855-diagnostico';
 script.async=false;
 script.onerror=function(){
   showError('Não foi possível baixar monitoramento-sistemas.js. Verifique a publicação do arquivo no GitHub Pages.');
 };
 script.onload=function(){
   window.setTimeout(function(){
     if(!document.getElementById('iocGovMonitor')){
       showError('O arquivo JavaScript foi baixado, mas não iniciou o painel. A execução foi interrompida antes da renderização.');
     }
   },1500);
 };
 document.body.appendChild(script);
 window.setTimeout(function(){
   if(!finished && !document.getElementById('iocGovMonitor')){
     showError('O carregamento excedeu o tempo esperado. O painel não iniciou; tente recarregar e, se persistir, envie esta mensagem para diagnóstico.');
   }
 },10000);
})();
</script>
<noscript><p class="error">Ative o JavaScript para visualizar os dados atualizados do monitoramento.</p></noscript>
</body>
</html>
