name: Monitoramento técnico e operacional seguro (TESTE)
on:
  push:
    branches: [main]
    paths:
      - 'monitorar_sistemas.py'
      - '.github/workflows/monitoramento-sistemas.yml'
  schedule:
    # Segunda a sexta, a cada 30 minutos; UTC (06:00–19:30 no horário de Brasília).
    - cron: '*/30 9-22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: monitoramento-sistemas-teste
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar ambiente de teste
        uses: actions/checkout@v4
      - name: Executar verificações públicas
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 monitorar_sistemas.py
      - name: Persistir resultado e histórico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitoramento-sistemas.json
          if git diff --cached --quiet; then
            echo 'Sem alteração de estado para registrar.'
          else
            git commit -m "Atualiza monitoramento público dos sistemas"
            # Reaplica a coleta sobre a ponta mais recente para evitar perda
            # quando uma publicação do dashboard ocorre durante a execução.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Conflito ao integrar a coleta com main."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Resultado do monitoramento persistido."
                exit 0
              fi
              echo "Push concorrente; nova tentativa $attempt/3."
              sleep $((attempt * 2))
            done
            echo "Não foi possível persistir a coleta após três tentativas."
            exit 1
          fi

  publicar:
    needs: monitorar
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
    steps:
      - name: Baixar a versão atualizada do ambiente de teste
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar arquivos atualizados do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar monitoramento atualizado
        id: deployment
        uses: actions/deploy-pages@v4
