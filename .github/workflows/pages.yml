name: Publicar agente de teste no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxe do agente
        run: node --check agent.js
      - name: Testar integridade e respostas críticas
        run: node tests/agent.test.cjs
      - name: Testar perguntas da diretoria
        run: node tests/directoria.test.cjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar arquivos do site de teste
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar ambiente de teste
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
