name: Diagnóstico temporário do agente
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Executar bateria de 1000 perguntas V3
        run: |
          set +e
          node tests/stress-1000-v3.test.cjs > stress-1000-v3.log 2>&1
          echo "STRESS_1000_V3_EXIT=$?" >> stress-1000-v3.log
          cat stress-1000-v3.log
      - name: Publicar relatório da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-1000-v3
          path: |
            stress-1000-v3.log
            stress-1000-v2-report.json
