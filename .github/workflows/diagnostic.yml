name: Auditoria sistemática do agente — ambiente de teste
on:
  workflow_dispatch:
  push:
    branches: [main, auditoria-milhao]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Executar regressão, linguagem humana, QA e stress de 1000 perguntas
        run: |
          set +e
          node tests/agent.test.cjs > agent-regression.log 2>&1
          agent_status=$?
          node tests/human-questions.test.cjs > human-questions.log 2>&1
          human_status=$?
          node tests/agente-qa.test.js > agente-qa.log 2>&1
          qa_status=$?
          node tests/stress-1000-v3.test.cjs > stress-1000-v3.log 2>&1
          stress_status=$?
          {
            echo "agent_regression=$agent_status"
            echo "human_questions=$human_status"
            echo "agente_qa=$qa_status"
            echo "stress_1000_v3=$stress_status"
          } | tee audit-status.log
          cat agent-regression.log
          cat human-questions.log
          cat agente-qa.log
          cat stress-1000-v3.log
          if [ "$agent_status" -ne 0 ] || [ "$human_status" -ne 0 ] || [ "$qa_status" -ne 0 ] || [ "$stress_status" -ne 0 ]; then
            exit 1
          fi
      - name: Publicar evidências mesmo quando houver reprovação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-sistematica-agente
          path: |
            audit-status.log
            agent-regression.log
            human-questions.log
            agente-qa.log
            stress-1000-v3.log
            stress-1000-v3-report.json
