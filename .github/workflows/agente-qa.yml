name: Testes do Assistente IOC
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar contrato e integridade da base de teste
        run: node tests/data-contract.test.cjs
      - name: Validar respostas e agregações do agente
        run: node tests/quality.test.cjs
      - name: Validar perguntas em linguagem humana
        run: node tests/human-questions.test.cjs
      - name: Validar consultas de diretoria
        run: node tests/directoria.test.cjs
